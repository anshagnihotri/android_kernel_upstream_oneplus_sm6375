name: Build Kernel (Larry Upstream 6.1)

on:
  push:
    branches:
      - lineage-24.0
  pull_request:

jobs:
  build:
    name: Compile Android Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/larry_GKI.config
      CLANG_VERSION: r487747c

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel_workspace

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 llvm lld

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          git clone --depth=1 -b android14-release --filter=blob:none https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          cd clang-repo
          git sparse-checkout set clang-${CLANG_VERSION}
          cd ..
          mv clang-repo/clang-${CLANG_VERSION}/* .
          rm -rf clang-repo

      - name: Compile Kernel
        run: |
          export PATH=${GITHUB_WORKSPACE}/toolchains/clang/bin:$PATH
          cd kernel_workspace
          
          echo "=> Generating defconfig..."
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          
          echo "=> Compiling kernel and modules..."
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- -j2

      - name: Package Artifacts
        if: success()
        run: |
          mkdir -p kernel-artifacts
          cp kernel_workspace/out/arch/arm64/boot/Image kernel-artifacts/
          find kernel_workspace/out -name "*.ko" -exec cp {} kernel-artifacts/ \;
          find kernel_workspace/out -name "*.dtb" -exec cp {} kernel-artifacts/ \;
          find kernel_workspace/out -name "*.dtbo" -exec cp {} kernel-artifacts/ \;

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-larry-6.1
          path: kernel-artifacts/
